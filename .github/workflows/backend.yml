name: ci/cd backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_REPO_DIR: ${{ secrets.REMOTE_REPO_DIR }}
      BACKEND_DIR: ${{ secrets.BACKEND_DIR }}
      PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
      # Use the existing frontend plan secrets as the single source of truth.
      # They are exported under the server's RZP_* names over SSH below.
      RZP_PLAN_PRO_MONTHLY: ${{ secrets.VITE_RZP_PLAN_PRO_MONTHLY }}
      RZP_PLAN_PRO_YEARLY: ${{ secrets.VITE_RZP_PLAN_PRO_YEARLY }}
      RZP_PLAN_PREMIUM_MONTHLY: ${{ secrets.VITE_RZP_PLAN_PREMIUM_MONTHLY }}
      RZP_PLAN_PREMIUM_YEARLY: ${{ secrets.VITE_RZP_PLAN_PREMIUM_YEARLY }}

    steps:
      - name: Validate Razorpay Plan Configuration
        run: |
          test -n "$RZP_PLAN_PRO_MONTHLY" || { echo "::error::Missing VITE_RZP_PLAN_PRO_MONTHLY secret"; exit 1; }
          test -n "$RZP_PLAN_PRO_YEARLY" || { echo "::error::Missing VITE_RZP_PLAN_PRO_YEARLY secret"; exit 1; }
          test -n "$RZP_PLAN_PREMIUM_MONTHLY" || { echo "::error::Missing VITE_RZP_PLAN_PREMIUM_MONTHLY secret"; exit 1; }
          test -n "$RZP_PLAN_PREMIUM_YEARLY" || { echo "::error::Missing VITE_RZP_PLAN_PREMIUM_YEARLY secret"; exit 1; }

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" << EOF
            set -e

            echo "Moving to repository..."
            cd "$REMOTE_REPO_DIR"

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting repository to origin/main..."
            git reset --hard origin/main

            echo "Removing untracked files..."
            git clean -fd

            echo "Moving to backend..."
            cd "$BACKEND_DIR"

            export RZP_PLAN_PRO_MONTHLY="$RZP_PLAN_PRO_MONTHLY"
            export RZP_PLAN_PRO_YEARLY="$RZP_PLAN_PRO_YEARLY"
            export RZP_PLAN_PREMIUM_MONTHLY="$RZP_PLAN_PREMIUM_MONTHLY"
            export RZP_PLAN_PREMIUM_YEARLY="$RZP_PLAN_PREMIUM_YEARLY"

            echo "Installing dependencies..."
            npm ci --omit=dev --no-audit --no-fund

            echo "Restarting PM2..."
            pm2 restart "$PM2_APP_NAME" --update-env

            echo "Backend deployed successfully."
          EOF
