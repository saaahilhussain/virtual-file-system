name: ci/cd backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "infra/aws/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-shelter-backend
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_ID: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821656895501:role/FileShelterDemoBackendDeployRole
          allowed-account-ids: "821656895501"
          aws-region: ap-south-1

      - name: Package Tested Backend
        run: |
          tar --exclude='server/.env' --exclude='server/node_modules' --exclude='server/storage' --exclude='server/coverage' \
            -czf "$RUNNER_TEMP/backend.tar.gz" server infra/aws
          aws s3 cp "$RUNNER_TEMP/backend.tar.gz" \
            "s3://file-shelter-artifacts-821656895501-mumbai/releases/$RELEASE_ID/backend.tar.gz"

      - name: Deploy Tested Git Commit Through Systems Manager
        id: deployment
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, shlex
          release = os.environ['RELEASE_ID']
          assert re.fullmatch(r'[0-9a-f]{40}', release)
          script = pathlib.Path('infra/aws/deploy-backend.sh').read_bytes()
          encoded = base64.b64encode(script).decode()
          command = f"printf '%s' {shlex.quote(encoded)} | base64 -d > /tmp/file-shelter-deploy.sh\nbash /tmp/file-shelter-deploy.sh {shlex.quote(release)}"
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ssm-parameters.json'
          target.write_text(json.dumps({'commands': [command], 'executionTimeout': ['900']}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fd3ead0d7e6eaecf \
            --document-name AWS-RunShellScript \
            --comment "File Shelter release $RELEASE_ID" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id i-0fd3ead0d7e6eaecf

      - name: Report Deployment Result
        if: always() && steps.deployment.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0fd3ead0d7e6eaecf \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
