name: ci/cd frontend
on:
  push:
    branches:
      - main
    paths:
      - "client/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: file-shelter-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Build Application
        run: |
          test -n "$VITE_RZP_KEY_ID" || { echo "::error::Missing VITE_RZP_KEY_ID secret"; exit 1; }
          test -n "$VITE_RZP_PLAN_PRO_MONTHLY" || { echo "::error::Missing VITE_RZP_PLAN_PRO_MONTHLY secret"; exit 1; }
          test -n "$VITE_RZP_PLAN_PRO_YEARLY" || { echo "::error::Missing VITE_RZP_PLAN_PRO_YEARLY secret"; exit 1; }
          test -n "$VITE_RZP_PLAN_PREMIUM_MONTHLY" || { echo "::error::Missing VITE_RZP_PLAN_PREMIUM_MONTHLY secret"; exit 1; }
          test -n "$VITE_RZP_PLAN_PREMIUM_YEARLY" || { echo "::error::Missing VITE_RZP_PLAN_PREMIUM_YEARLY secret"; exit 1; }
          npm run build
        env:
          VITE_BACKEND_BASE_URI: https://api.fileshelter.app
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}   
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.VITE_GITHUB_REDIRECT_URI }}
          VITE_RZP_KEY_ID: ${{ secrets.VITE_RZP_KEY_ID }}
          VITE_RZP_PLAN_PRO_MONTHLY: ${{ secrets.VITE_RZP_PLAN_PRO_MONTHLY }}
          VITE_RZP_PLAN_PRO_YEARLY: ${{ secrets.VITE_RZP_PLAN_PRO_YEARLY }}
          VITE_RZP_PLAN_PREMIUM_MONTHLY: ${{ secrets.VITE_RZP_PLAN_PREMIUM_MONTHLY }}
          VITE_RZP_PLAN_PREMIUM_YEARLY: ${{ secrets.VITE_RZP_PLAN_PREMIUM_YEARLY }}
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821656895501:role/FileShelterDemoFrontendDeployRole
          allowed-account-ids: "821656895501"
          aws-region: ap-south-1

      - name: Upload Build to S3
        run: |
          aws s3 sync dist/assets s3://file-shelter-frontend-821656895501-mumbai/assets --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist s3://file-shelter-frontend-821656895501-mumbai --delete --exclude "assets/*" --exclude "index.html" --cache-control "public,max-age=3600"
          aws s3 cp dist/index.html s3://file-shelter-frontend-821656895501-mumbai/index.html --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1GKIK1Q7BCJ3R \
            --paths "/*"
